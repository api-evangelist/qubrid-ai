  - aid: qubrid-ai:rag
    name: Qubrid AI RAG API
    description: The Qubrid AI RAG API provides retrieval-augmented generation capabilities that allow developers to upload
      departmental or enterprise data and query it using large language models. The API handles document ingestion, embedding
      generation, vector storage, and context-aware retrieval to ground model responses in organizational knowledge.
