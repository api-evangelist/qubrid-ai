modified: '2026-03-24'
apis:
  - aid: qubrid-ai:inference-api
    name: Qubrid AI Inference API
    tags:
      - Artificial Intelligence
      - Inference
      - Large Language Models
      - Machine Learning
      - NVIDIA
      - Serverless
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://platform.qubrid.com/v1
    humanURL: https://docs.platform.qubrid.com
    properties:
      - url: https://docs.platform.qubrid.com
        type: Documentation
      - url: openapi/qubrid-ai-inference-openapi.yml
        type: OpenAPI
      - url: json-schema/qubrid-ai-inference-schema.json
        type: JSONSchema
    description: >-
      The Qubrid AI Inference API provides a single, OpenAI-compatible endpoint
      for orchestrating 40+ open-source models running on NVIDIA GPU
      infrastructure. By abstracting hardware orchestration through TensorRT-LLM
      and Triton Inference Server, the API allows enterprise developers to run
      inference on models without managing underlying infrastructure. The API
      supports serverless endpoints as well as dedicated GPU clusters, enabling
      workloads to scale with zero code changes. Authentication uses bearer
      tokens, and the chat completions endpoint is compatible with standard
      OpenAI SDKs across Python, JavaScript, Go, and cURL.
  - aid: qubrid-ai:compute-api
    name: Qubrid AI Compute API
    tags:
      - Cloud Computing
      - GPU
      - NVIDIA
      - Infrastructure
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://platform.qubrid.com/api/v1
    humanURL: https://docs.platform.qubrid.com
    properties:
      - url: https://docs.platform.qubrid.com
        type: Documentation
      - url: openapi/qubrid-ai-compute-openapi.yml
        type: OpenAPI
      - url: json-schema/qubrid-ai-compute-schema.json
        type: JSONSchema
    description: >-
      The Qubrid AI Compute API provides programmatic access to GPU cloud
      infrastructure including NVIDIA H100, H200, and B200 accelerators.
      Developers can provision and manage GPU instances for AI and machine
      learning workloads through API calls. The service supports on-demand
      compute for training, fine-tuning, and batch inference jobs, with
      usage-based billing and enterprise features such as team collaboration
      and usage tracking.
  - aid: qubrid-ai:fine-tuning-api
    name: Qubrid AI Fine-Tuning API
    tags:
      - Artificial Intelligence
      - Fine-Tuning
      - Machine Learning
      - Model Training
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://platform.qubrid.com/api/v1
    humanURL: https://docs.platform.qubrid.com
    properties:
      - url: https://docs.platform.qubrid.com
        type: Documentation
      - url: https://docs.platform.qubrid.com/Fine%20Tuning
        type: Documentation
      - url: openapi/qubrid-ai-fine-tuning-openapi.yml
        type: OpenAPI
      - url: json-schema/qubrid-ai-fine-tuning-schema.json
        type: JSONSchema
    description: >-
      The Qubrid AI Fine-Tuning API enables developers and enterprises to
      customize open-source AI models using their own data. The API provides
      endpoints for uploading training datasets, configuring fine-tuning
      parameters, launching training jobs on GPU infrastructure, and retrieving
      fine-tuned model artifacts. Qubrid supports both no-code and API-driven
      fine-tuning workflows, making it accessible to teams with varying levels
      of ML expertise.
  - aid: qubrid-ai:rag-api
    name: Qubrid AI RAG API
    tags:
      - Artificial Intelligence
      - RAG
      - Retrieval Augmented Generation
      - Search
      - Knowledge Management
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://platform.qubrid.com/api/v1
    humanURL: https://docs.platform.qubrid.com
    properties:
      - url: https://docs.platform.qubrid.com
        type: Documentation
      - url: openapi/qubrid-ai-rag-openapi.yml
        type: OpenAPI
      - url: json-schema/qubrid-ai-rag-schema.json
        type: JSONSchema
    description: >-
      The Qubrid AI RAG API provides retrieval-augmented generation capabilities
      that allow developers to upload departmental or enterprise data and query
      it using large language models. The API handles document ingestion,
      embedding generation, vector storage, and context-aware retrieval to
      ground model responses in organizational knowledge. This enables
      enterprises to build AI applications that answer questions based on
      proprietary data with near real-time performance.
common:
