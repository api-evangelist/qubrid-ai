aid: qubrid-ai
name: Qubrid AI
description: Qubrid AI is a cloud platform that provides GPU-accelerated infrastructure and AI services for enterprise developers.
  Their developer platform offers OpenAI-compatible inference endpoints, GPU compute provisioning, model fine-tuning, and
  retrieval-augmented generation capabilities, all running on NVIDIA GPU infrastructure.
kind: contract
position: Consuming
access: 3rd-Party
