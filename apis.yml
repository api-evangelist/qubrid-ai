  - aid: qubrid-ai:fine-tuning
    name: Qubrid AI Fine-Tuning API
    description: The Qubrid AI Fine-Tuning API enables developers and enterprises to customize open-source AI models using their
      own data. The API provides endpoints for uploading training datasets, configuring fine-tuning parameters, launching training
      jobs on GPU infrastructure, and retrieving fine-tuned model artifacts.
