apis:
  - aid: qubrid-ai:inference
    name: Qubrid AI Inference API
    description: The Qubrid AI Inference API provides a single, OpenAI-compatible endpoint for orchestrating 40+ open-source
      models running on NVIDIA GPU infrastructure. By abstracting hardware orchestration through TensorRT-LLM and Triton Inference
      Server, the API allows enterprise developers to run inference on models without managing underlying infrastructure.
    humanURL: https://docs.platform.qubrid.com
    baseURL: https://platform.qubrid.com/api/v1
