specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Qubrid AI
providerId: qubrid-ai
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Artificial Intelligence
  - Inference
  - GPU
  - Rate Limiting
description: Qubrid AI does not publish numeric per-second or per-minute API rate limits on its public
  pricing or product pages. The serverless inference endpoint is OpenAI-compatible and exposed via
  the Qubrid platform; per-account throttling and quotas are managed inside the console once an account
  is funded. Concrete TPS/RPM ceilings should be confirmed via the Qubrid API key dashboard or sales
  team.
sources:
  - https://www.qubrid.com/pricing
  - https://www.qubrid.com/serverless-inferencing
notes: Public pages do not document per-second or per-minute rate-limit numbers. Reconcile via the platform
  console (https://platform.qubrid.com/playground) or sales engagement.
responseCodes:
  throttled: 429
limits:
  - name: Inference Rate Limit
    scope: api-key
    metric: varies
    limit: see Qubrid platform console
    notes: Per-API-key throttling not published on the public pricing page; check the platform dashboard.
  - name: GPU Provisioning Quota
    scope: account
    metric: varies
    limit: see Qubrid platform console
    notes: GPU VM and bare-metal availability is provisioned on request; capacity caps depend on the
      contract term and inventory.
policies:
  - name: Backoff Strategy
    description: Clients hitting 429 responses on the OpenAI-compatible inference endpoint should apply
      exponential backoff with jitter.
  - name: Quota Source
    description: Numeric request and token quotas are set per-API-key in the Qubrid platform console;
      enterprise customers can negotiate higher limits via sales.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
